server.port=${PORT:8080}
spring.application.name=yojna-setu-gateway

# ── MongoDB (replaces PostgreSQL/JPA/Flyway per ADR-001) ──────────────────────
# Atlas Mumbai region in prod; local dev: docker run --name yojna-mongo -p 27017:27017 mongo:7
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DB:yojnasetu}
# Spring Data MongoDB does NOT create @Indexed/@CompoundIndexes-declared indexes by
# default — without this, OtpSession's TTL index and Application's unique index
# silently don't exist (found the hard way 2026-07-03).
spring.data.mongodb.auto-index-creation=true

# ── Email OTP (SMTP) — the email login channel ───────────────────────────────
# Optional: if app.mail.enabled=false or creds are blank, OtpService/EmailService
# LOG the code instead of sending (dev fallback). Gmail: host smtp.gmail.com:587
# with an App Password (not the account password).
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Yojna Sarthi}
app.mail.enabled=${MAIL_ENABLED:false}
app.frontend-url=${FRONTEND_URL:}

# Firebase phone-auth: service-account JSON (raw or base64) used to verify the
# ID token the browser gets after Firebase sends the SMS OTP. Empty = phone
# login disabled (email OTP unaffected). Load from a secret in prod.
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

# Self-alerting: AlertNotifier emails this address a digest of unresolved
# agent_alerts (empty = disabled, no polling emails). Poll every 15 min.
app.alert.email=${ALERT_EMAIL:}
app.alert.poll-ms=${ALERT_POLL_MS:900000}
app.alert.initial-delay-ms=${ALERT_INITIAL_DELAY_MS:60000}

# ── JWT (RS256 — see JwtUtils for key loading / dev-fallback behavior) ────────
app.jwt.private-key-path=${JWT_PRIVATE_KEY_PATH:}
app.jwt.public-key-path=${JWT_PUBLIC_KEY_PATH:}
app.jwt.private-key-pem=${JWT_PRIVATE_KEY:}
app.jwt.public-key-pem=${JWT_PUBLIC_KEY:}
app.jwt.access-token-expiry-minutes=${JWT_ACCESS_EXPIRY_MIN:60}
app.jwt.refresh-token-expiry-days=${JWT_REFRESH_EXPIRY_DAYS:7}

# ── Cookies ─────────────────────────────────────────────────────────────────
# false only for local http:// dev — MUST be true in any deployed environment
app.cookie.secure=${COOKIE_SECURE:false}

# ── Field encryption (AES-256-GCM) ─────────────────────────────────────────────
# Generate with: openssl rand -base64 32 — must match ai_service's FIELD_ENCRYPTION_KEY
encryption.key=${FIELD_ENCRYPTION_KEY:}
encryption.aadhaar-salt=${AADHAAR_SALT:}

# ── Twilio (OTP SMS) — optional in dev, see OtpService ─────────────────────────
twilio.account-sid=${TWILIO_ACCOUNT_SID:}
twilio.auth-token=${TWILIO_AUTH_TOKEN:}
twilio.from-number=${TWILIO_FROM_NUMBER:}

# ── Internal service-to-service key (FastAPI <-> Spring Boot) ─────────────────
app.internal-service-key=${INTERNAL_SERVICE_KEY:}

# ── FastAPI AI Hub URL ──────────────────────────────────────────────────────
app.fastapi.url=${FASTAPI_URL:http://localhost:8000}

# ── CORS ────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173},http://localhost:3000

# ── Logging ─────────────────────────────────────────────────────────────────
logging.level.com.yojnasetu=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.data.mongodb=INFO
